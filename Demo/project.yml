name: VoiceGlowDemo
options:
  bundleIdPrefix: dev.codex
  deploymentTarget:
    iOS: '26.0'
packages:
  VoiceGlowSwift:
    path: ..
targets:
  VoiceGlowDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: VoiceGlowSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.codex.VoiceGlowDemo
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
